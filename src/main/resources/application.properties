# 서버 포트
server.port=8080
spring.application.name=hsproject

hs.station.bootstrap.json.enabled=true


# 데이터소스
spring.datasource.url=jdbc:mariadb://localhost:3306/don
spring.datasource.username=hs
spring.datasource.password=123456
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JSP 뷰 리졸버
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# MyBatis
mybatis.mapper-locations=classpath:mybatis/mapper/**/*.xml
mybatis.type-aliases-package=com.tech.hs.dto
mybatis.configuration.map-underscore-to-camel-case=true

# 에어코리아(미세먼지 농도)
air.base-url=https://apis.data.go.kr/B552584/ArpltnInforInqireSvc
air.service-key=5a9f2ede48b1ba5dede90f126eae8a9469568790595cd42b880b61c80480eddd
air.timeout-ms=2500

# 한글 파라미터/응답 인코딩 강제
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true


# MyBatis 실행 쿼리/파라미터 로그
logging.level.org.mybatis=DEBUG
logging.level.org.apache.ibatis=DEBUG
logging.level.com.tech.hs.dao=DEBUG
# JDBC 바인딩 파라미터
logging.level.jdbc.sqlonly=DEBUG
logging.level.jdbc.sqltiming=DEBUG
logging.level.jdbc.resultset=DEBUG
logging.level.jdbc.audit=DEBUG


