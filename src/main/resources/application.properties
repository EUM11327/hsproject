# 서버 포트
server.port=8080
spring.application.name=hsproject

# 데이터소스
spring.datasource.url=jdbc:mariadb://localhost:3306/don
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:your-username}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:your-password}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JSP 뷰 리졸버
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# MyBatis
mybatis.mapper-locations=classpath:mybatis/mapper/**/*.xml
mybatis.type-aliases-package=com.tech.hs.dto

# 에어코리아(미세먼지 농도)
